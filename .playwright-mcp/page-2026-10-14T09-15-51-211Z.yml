      - generic [ref=f4e32]:
        - heading "Company Profile — HANSA Management Ltd." [level=1] [ref=f4e33]
        - generic [ref=f4e34]:
          - paragraph [ref=f4e35]: HANSA MANAGEMENT LTD. is a leading integrated Hospitality and Facility Management company founded by UNIQUE GROUP, which is one of the largest Bangladeshi conglomerates pioneered the first private owned Five-Star hotel “THE WESTIN DHAKA’’. Today, the span of UG operations has been diversified into more than twenty different business areas. These include Hospitality, Health Care, Educational Institution, Training & Development, Human Resources Development & Export, Real Estate, Construction & Infrastructure Development, Telecommunication, Stock Brokerage House, Bank, Insurance, Financial Institution, Ready Mix Concrete, Ceramic Industry, Private Economic Zone, Agro, Energy & Power, International Trade, Aviation, Media & Publications and last but not the least the Facility Management Services.
          - paragraph [ref=f4e36]: HANSA Management has accumulated an extensive experience of offering our expertise to blue chip corporates, Government, SMEs and private residence complexes. Incorporated in 2015, we become one of the fastest growing companies in our domain.
          - paragraph [ref=f4e37]: With a dynamic and professional management team and a culture of innovation, learning, quality and deep service orientation; we could become the priority of choices for organizations who need to focus on their core business and outsource other non-core operations.
          - paragraph [ref=f4e38]: From specialized Security, Cleaning and Hygiene services, white-glove Housekeeping, MEP (Mechanical, Electrical & Plumbing) Pest Control, Landscaping to Façade Cleaning; We have a bouquet of services that meet organizations’ asset and facilities management requirements.
          - paragraph [ref=f4e39]: We can meet the demand of the time that different corporates, business entrepreneurs, housing cities desire the comforts and services.
