        - heading "Charter of Unique Group" [level=1] [ref=f21e33]
        - generic [ref=f21e34]:
          - paragraph [ref=f21e35]: Unique Group, a business conglomerate in Bangladesh, began its operation in 1982. It started its journey by exporting human resources and then pioneered skill development. It has spearheaded luxury hotel industry in Bangladesh.
          - paragraph [ref=f21e36]: Over the years, the Group has diversified its business into many sectors including real estate and facilities management, tours and travels, education, financial institutions, ceramics, media, telecommunications, and agro based business. Today the Group is contributing to the national economy immensely.
          - paragraph [ref=f21e37]: We value our customers under all and any circumstances. We deliver quality products on time, ensuring secure and good return on investment with excellent service. The direction of our future is being set by our customers.
          - paragraph [ref=f21e38]: The purpose of Unique Group is to act boldly by pioneering new business directions and opportunities. We exist to provide world-class experience to our distinguished customers.
