                - generic [ref=f20e47]:
                  - paragraph [ref=f20e48]: Unique Group, a business conglomerate in Bangladesh, began its operation in 1982. It started its journey by exporting human resources and then pioneered skill development. It has spearheaded luxury hotel industry in Bangladesh.
                  - paragraph [ref=f20e49]: Over the years, the Group has diversified its business into many sectors including real estate and facilities management, tours and travels, education, financial institutions, ceramics, media, telecommunications, and agro based business. Today the Group is contributing to the national economy immensely.
                  - paragraph [ref=f20e50]: We value our customers under all and any circumstances. We deliver quality products on time, ensuring secure and good return on investment with excellent service. The direction of our future is being set by our customers.
